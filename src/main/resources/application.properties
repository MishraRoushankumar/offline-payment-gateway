spring.application.name=offline-payment-gateway
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:offline_payment}
spring.datasource.username=${POSTGRES_USER:payment_app}
spring.datasource.password=${POSTGRES_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Server
server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
